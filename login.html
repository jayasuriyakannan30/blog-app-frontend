<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inkwell — Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <div class="container auth-wrap">
      <div class="card auth-card">
        <h1>Welcome back</h1>
        <p class="sub">Log in to manage your posts.</p>

        <div class="alert" id="formAlert" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>
            <div class="field-error"></div>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="pw-wrap">
              <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Your password" required>
              <button type="button" class="pw-toggle" aria-label="Show password">Show</button>
            </div>
            <div class="field-error"></div>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Log in</button>
        </form>

        <p class="auth-foot">New to Inkwell? <a href="register.html">Create an account</a></p>
      </div>
    </div>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
