<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inkwell — Create account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <div class="container auth-wrap">
      <div class="card auth-card">
        <h1>Create your account</h1>
        <p class="sub">Start publishing in under a minute.</p>

        <div class="alert" id="formAlert" role="alert"></div>

        <form id="registerForm" novalidate>
          <div class="form-group">
            <label for="name">Full name</label>
            <input type="text" id="name" name="name" autocomplete="name" placeholder="Your name" required>
            <div class="field-error"></div>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>
            <div class="field-error"></div>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="pw-wrap">
              <input type="password" id="password" name="password" autocomplete="new-password" placeholder="At least 8 characters" required>
              <button type="button" class="pw-toggle" aria-label="Show password">Show</button>
            </div>
            <div class="strength" aria-hidden="true"><span id="strengthBar"></span></div>
            <div class="hint" id="strengthText">Use 8+ characters with a mix of letters, numbers and symbols.</div>
            <div class="field-error"></div>
          </div>
          <div class="form-group">
            <label for="confirm">Confirm password</label>
            <input type="password" id="confirm" name="confirm" autocomplete="new-password" placeholder="Re-enter password" required>
            <div class="field-error"></div>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Create account</button>
        </form>

        <p class="auth-foot">Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </div>
  </main>

  <script type="module" src="js/register.js"></script>
</body>
</html>
